name: Linux CI

# Runs on every branch/tag push and manual dispatch. Runs the full
# `cargo test --workspace` suite on Ubuntu, then packages a .deb and
# apt-installs + smoke-tests it so the `Depends:` line is exercised end to end.
# Release assets are published only for v* tags.
#
# cpc discovers a clang >= 19 itself (it probes clang / clang-21 / clang-20 /
# clang-19, honoring $CPC_CLANG), so installing clang-19 is enough — no
# update-alternatives. Ubuntu 24.04's bare `clang` is still 18, which lacks the
# `preserve_nonecc` calling convention cpc emits.
#
# SUPPLY CHAIN (security audit F05): the workflow's token is read-only. The
# jobs that compile — and so run every dependency's build code — hold no write
# token and do not persist one into .git/config. A release asset is published
# by a separate job that runs no build code: it downloads the artifact, attests
# its provenance and uploads it, never replacing an existing asset. Actions are
# pinned to commits (tag in a comment); the ref name reaches a script only
# through `env:` and is checked first.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # E2E fixtures share vendored packages and their mutable prebuild outputs.
  # Concurrent tests can delete another test's in-flight object directory.
  RUST_TEST_THREADS: "1"

jobs:
  test:
    name: cargo test --workspace (Ubuntu, clang-19)
    runs-on: ubuntu-latest # currently Ubuntu 24.04 (amd64)
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install clang-19
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-19
          clang-19 --version | head -1

      - name: Run the workspace test suite
        run: cargo test --workspace --no-fail-fast

  build-deb:
    name: Build + apt-install + smoke-test the .deb
    runs-on: ubuntu-latest # currently Ubuntu 24.04 (amd64)
    needs: test
    outputs:
      pkg: ${{ steps.deb.outputs.pkg }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # No rust-cache: what may become a release asset is built from a clean
      # target/, not from one a test run could have written into.
      - name: Build release binaries
        run: cargo build --release -p cpc -p cpc-lsp -p cpc-bindgen

      - name: Stage and build the .deb
        id: deb
        run: |
          set -euo pipefail
          # Upstream version from the cpc crate; append a git short SHA so dev
          # builds get unique, sortable versions.
          UPSTREAM="$(sed -n 's/^version *= *"\(.*\)"/\1/p' cpc/Cargo.toml | head -1)"
          SHA="$(git rev-parse --short=7 HEAD)"
          VER="${UPSTREAM}~git${SHA}-1"
          PKG="cplus_${VER}_amd64"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "pkg=$PKG"     >> "$GITHUB_OUTPUT"

          # Lay out the package tree.
          ROOT="dist/${PKG}"
          install -d "$ROOT/DEBIAN" "$ROOT/usr/bin"
          for b in cpc cpc-lsp cpc-bindgen; do
            install -m0755 "target/release/$b" "$ROOT/usr/bin/$b"
            strip "$ROOT/usr/bin/$b" || true
          done

          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: cplus
          Version: ${VER}
          Section: devel
          Priority: optional
          Architecture: amd64
          Depends: clang-19, binutils
          Maintainer: netdur <netdur@gmail.com>
          Homepage: https://cplus-lang.dev
          Description: C+ programming language toolchain
           The C+ compiler (cpc), language server (cpc-lsp), and FFI binding
           generator (cpc-bindgen). cpc emits LLVM IR and links via clang;
           requires clang/LLVM 19 or newer.
          EOF

          dpkg-deb --root-owner-group --build "$ROOT"
          ls -l dist/*.deb
          dpkg-deb --info "dist/${PKG}.deb"
          dpkg-deb --contents "dist/${PKG}.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ steps.deb.outputs.pkg }}
          path: dist/*.deb
          if-no-files-found: error
          # Cap accumulation against the account storage quota; the durable copy
          # is attached to the GitHub Release on a tag.
          retention-days: 14

      - name: Install the .deb via apt (resolves Depends, incl. clang-19)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y "./dist/${{ steps.deb.outputs.pkg }}.deb"
          # Intentionally NOT setting update-alternatives: prove cpc finds
          # clang-19 itself even though the bare `clang` here is 18.
          echo "bare clang: $(clang --version | head -1)"
          command -v cpc cpc-lsp cpc-bindgen

      - name: Smoke-test the installed cpc on a clean runner
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cat > "$tmp/hello.cplus" <<'EOF'
          extern fn printf(fmt: *u8, ...) -> i32;
          fn main() -> i32 {
              let msg: str = "hello from C+ on Linux\n";
              { printf(#str_ptr(msg)); }
              return 42;
          }
          EOF
          cpc "$tmp/hello.cplus" -o "$tmp/hello"
          set +e
          "$tmp/hello"
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 42
          echo "OK: installed cpc compiled, linked, and ran a native binary."

  publish-deb:
    name: Attach the .deb to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release and upload the asset
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-deb.outputs.pkg }}
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.deb

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          # Idempotent across the parallel release workflows: create if absent
          # (another may win the race). No --clobber: an asset is never replaced.
          gh release create "$TAG" --title "$TAG" --notes "Prebuilt binaries for $TAG." \
            || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" dist/*.deb
