name: Release binaries

# On a vX.Y.Z tag build the cpc toolchain for macOS / Apple Silicon, attach a
# tarball to the GitHub Release, and rewrite the Homebrew tap formula to install
# that prebuilt binary — so `brew install netdur/cplus/cplus` needs no Rust and
# no compile.
#
# Requires repo secret HOMEBREW_TAP_TOKEN (Contents: read/write on
# netdur/homebrew-cplus).
#
# SUPPLY CHAIN (security audit F05). The job that BUILDS holds no write token:
# compiling runs every dependency's build code, so a compromised crate there
# must not be able to push to this repository or replace a release. Publishing
# is a separate job that runs no build code — it downloads the built tarball,
# attests its provenance and uploads it. The release build starts from a clean
# target/ (no shared cache a CI run could have written into). Every action is
# pinned to a commit, with its tag in a comment. A ref name reaches a script
# only through `env:` and is checked before use. An existing release asset is
# never overwritten.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-14 # Apple Silicon
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.pkg.outputs.sha }}
      asset: ${{ steps.pkg.outputs.asset }}
    steps:
      - name: Resolve and check the tag
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out source at the tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.meta.outputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      # No rust-cache: a release is built from a clean target/.
      - name: Verify crate version matches tag and build release binaries
        env:
          WANT_VER: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          CRATE_VER="$(sed -n 's/^version *= *"\(.*\)"/\1/p' cpc/Cargo.toml | head -1)"
          if [[ "$CRATE_VER" != "$WANT_VER" ]]; then
            echo "cpc/Cargo.toml version ($CRATE_VER) does not match tag version ($WANT_VER)" >&2
            exit 1
          fi
          cargo build --locked --release -p cpc -p cpc-lsp -p cpc-bindgen

      - name: Package tarball
        id: pkg
        run: |
          set -euo pipefail
          ASSET="cplus-aarch64-apple-darwin.tar.gz"
          tar -czf "$ASSET" -C target/release cpc cpc-lsp cpc-bindgen
          SHA="$(shasum -a 256 "$ASSET" | cut -d' ' -f1)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "built $ASSET ($SHA)"

      - name: Hand the tarball to the publish job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-macos-arm64
          path: ${{ steps.pkg.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  publish-macos-arm64:
    needs: build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release and upload the asset
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos-arm64

      - name: Check the tarball is the one the build measured
        env:
          ASSET: ${{ needs.build-macos-arm64.outputs.asset }}
          SHA: ${{ needs.build-macos-arm64.outputs.sha }}
        run: |
          set -euo pipefail
          echo "$SHA  $ASSET" | sha256sum -c -

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ needs.build-macos-arm64.outputs.asset }}

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build-macos-arm64.outputs.tag }}
          ASSET: ${{ needs.build-macos-arm64.outputs.asset }}
        run: |
          set -euo pipefail
          # Idempotent across the parallel release workflows, which all fire on
          # the same tag: create if absent (another may win the race).
          gh release create "$TAG" --title "$TAG" --notes "Prebuilt binaries for $TAG." \
            || gh release view "$TAG" >/dev/null
          # No --clobber: an asset already on a release is never replaced.
          gh release upload "$TAG" "$ASSET"

  bump-tap:
    needs: [build-macos-arm64, publish-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source (for the formula template)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check out the tap
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: netdur/homebrew-cplus
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render formula from template
        env:
          VERSION: ${{ needs.build-macos-arm64.outputs.version }}
          SHA: ${{ needs.build-macos-arm64.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $VERSION" >&2; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "bad sha256: $SHA" >&2; exit 1; }
          sed -e "s/@VERSION@/$VERSION/g" \
              -e "s/@SHA@/$SHA/g" \
              .github/homebrew/cplus.rb.in > tap/Formula/cplus.rb
          echo "----- rendered formula -----"
          cat tap/Formula/cplus.rb

      - name: Commit and push to the tap
        env:
          VERSION: ${{ needs.build-macos-arm64.outputs.version }}
        run: |
          set -euo pipefail
          cd tap
          if git diff --quiet; then
            echo "Formula already up to date; nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cplus.rb
          git commit -m "cplus $VERSION (prebuilt)"
          git push
