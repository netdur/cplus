name: Windows CI

# Builds, tests, and packages the toolchain on Windows (x86_64-pc-windows-msvc)
# on every branch/tag push and manual dispatch. Runs the full suite, builds
# release binaries, and smoke-tests cpc. On a v* tag it also attaches a
# binaries .zip to the GitHub Release.
#
# cpc emits LLVM IR and shells out to clang to assemble/link, so the runner
# needs clang >= 19 (for the `preserve_nonecc` calling convention cpc emits) on
# PATH. The MSVC linker comes from the runner's preinstalled Visual Studio
# (Rust's *-windows-msvc toolchain locates it automatically — no setup). The
# clang ASan runtime dir is also put on PATH so the `--asan` e2e tests can load
# clang_rt.asan_dynamic at run time.
#
# SUPPLY CHAIN (security audit F05): the workflow's token is read-only. The
# jobs that compile — and so run every dependency's build code — hold no write
# token and do not persist one into .git/config. A release asset is published
# by a separate job that runs no build code: it downloads the artifact, attests
# its provenance and uploads it, never replacing an existing asset. Actions are
# pinned to commits (tag in a comment); the ref name reaches a script only
# through `env:` and is checked first.
#
# The release .zip is NOT the test job's tree: on a v* tag `build-release`
# compiles the three binaries afresh, with no cache and no tests run first.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # E2E fixtures share vendored packages and their mutable prebuild outputs.
  # Concurrent tests can delete another test's in-flight object directory.
  RUST_TEST_THREADS: "1"

jobs:
  build-test:
    name: cargo test + build (Windows, clang)
    runs-on: windows-latest
    steps:
      - name: Preserve fixture line endings
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install LLVM/clang (>= 19)
        run: choco upgrade llvm -y --no-progress

      - name: Install Maven fixture archive tools
        run: choco install zip unzip -y --no-progress

      - name: Put clang + ASan runtime on PATH
        shell: pwsh
        run: |
          $bin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$bin\clang.exe")) { throw "clang not found at $bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          # The `--asan` e2e tests load clang_rt.asan_dynamic-x86_64.dll at run
          # time; its directory is not on PATH by default.
          $asan = Get-ChildItem "C:\Program Files\LLVM\lib\clang\*\lib\windows\clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($asan) { Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $asan.FullName) }

      - name: Versions
        run: |
          clang --version
          rustc --version

      - name: Run the workspace test suite
        run: cargo test --workspace --release --no-fail-fast

      - name: Build release binaries
        run: cargo build --release -p cpc -p cpc-lsp -p cpc-bindgen

      - name: Smoke-test the built cpc on a clean program
        shell: pwsh
        run: |
          $tmp = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP "smoke")
          $src = Join-Path $tmp "hello.cplus"
          @'
          extern fn printf(fmt: *u8, ...) -> i32;
          fn main() -> i32 {
              let msg: str = "hello from C+ on Windows\n";
              { printf(#str_ptr(msg)); }
              return 42;
          }
          '@ | Set-Content -Encoding ascii $src
          & "target\release\cpc.exe" $src -o (Join-Path $tmp "hello.exe")
          if ($LASTEXITCODE -ne 0) { throw "cpc failed to compile the program" }
          & (Join-Path $tmp "hello.exe")
          $code = $LASTEXITCODE
          Write-Host "exit code: $code"
          if ($code -ne 42) { throw "smoke test failed: expected 42, got $code" }
          Write-Host "OK: cpc compiled, linked, and ran a native binary."
          # The program intentionally exits 42, leaving $LASTEXITCODE=42; reset
          # it so the Actions pwsh wrapper doesn't fail the step on it.
          exit 0

      - name: Upload Windows binaries (workflow artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cplus-x86_64-pc-windows-msvc
          path: |
            target/release/cpc.exe
            target/release/cpc-lsp.exe
            target/release/cpc-bindgen.exe
          if-no-files-found: error
          # Cap accumulation against the account storage quota — this per-run
          # binary upload was the main churn (one ~3.7 MB artifact every run).
          retention-days: 14

  build-release:
    name: Release binaries (clean build, tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    steps:
      - name: Preserve fixture line endings
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      # No rust-cache and no tests: these are the bytes that get published.
      - name: Build release binaries
        run: cargo build --release -p cpc -p cpc-lsp -p cpc-bindgen

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Force -DestinationPath cplus-x86_64-pc-windows-msvc.zip -Path `
            target\release\cpc.exe, target\release\cpc-lsp.exe, target\release\cpc-bindgen.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x86_64
          path: cplus-x86_64-pc-windows-msvc.zip
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Attach the .zip to the GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release and upload the asset
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-windows-x86_64

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: cplus-x86_64-pc-windows-msvc.zip

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          # Idempotent across the parallel release workflows: create if absent
          # (another may win the race). No --clobber: an asset is never replaced.
          gh release create "$TAG" --title "$TAG" --notes "Prebuilt binaries for $TAG." \
            || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" cplus-x86_64-pc-windows-msvc.zip
