[package]
name    = "sqlite"
version = "0.0.1"
edition = "2026"

# sqlite — idiomatic SQLite plus its raw C ABI in one package.
#
# ONE PACKAGE ON EVERY PLATFORM, the same shape as camera and http:
# `sqlite/sqlite` is the application API, while `sqlite/raw` is the generated
# escape hatch and implementation seam. `raw.cplus` is the native SQLite C
# backend; a platform that needs a different bridge can shadow it with
# `raw_<platform>.cplus` without changing callers or adding another package.
#
# SOURCE-BUILT DELIBERATELY. The generated binding includes SQLite APIs whose
# availability depends on how a platform built SQLite (snapshot, scanstatus,
# normalize). Prebuilding would make those wrappers one monolithic archive and
# force every consumer to resolve optional symbols it never calls. Source
# compilation lets prune remove every unused wrapper first.
[build]
prebuild = false

[dependencies]
stdlib = "*"

# THE SYSTEM SQLITE where there is one, and our own where there is not.
#
# Apple and Linux ship libsqlite3 and the binding was generated from Apple's
# header, so those link the system copy. ANDROID HAS NONE AN APP MAY LINK: the
# platform's libsqlite.so is not an NDK library, and `-lsqlite3` failed with
# "unable to find library" (spendwise, 2026-10-08). MAUI's answer is the same
# as this one — SQLitePCLRaw's bundle_green ships e_sqlite3 inside the app.
#
# `bundled` is in the BASE table on purpose. It means "shipped where
# `lib/<triple>/` exists", and only lib/aarch64-linux-android/ does; declared
# under [android.link] instead, a macOS build would read that archive as an
# undeclared orphan (E0861), since the orphan check walks every triple. The
# archive is built by tools/build_android.sh and committed.
[link]
bundled = ["libsqlite3.a"]

[macos.link]
libs = ["sqlite3"]

[ios.link]
libs = ["sqlite3"]

[linux.link]
libs = ["sqlite3"]

[windows.link]
libs = ["sqlite3"]
