[package]
name    = "facet"
version = "0.0.1"
edition = "2026"

# facet — the UI vocabulary: 38 generated + 4 hand-written controls, the
# platform-free tier (Stage 3), and the mount seam a backend fills.

# Not prebuilt (2026-08-17). The structural blockers are gone — the runtime
# facades live in facet_runtime, the agent tier in facet_agent, and facet is
# now the pure platform-free core. What remains is the runtime bug that hits
# facet's BACKEND as a slice (divergent view-arming decisions, app dies in
# the key-view walk — bugs/facet-appkit-slice-runtime-crash.md). Until that
# is diagnosed, the facet family ships as source: a slice that might behave
# differently from the source build is worse than no cache.
[build]
prebuild = false

[dependencies]
stdlib      = "*"
flex_layout = "*"
events      = "*"
