[package]
name    = "fswatch"
version = "0.0.1"
edition = "2026"

# fswatch — owner-thread filesystem change events.
#
# Two backends, picked by C+'s platform override on `import "./backend"`:
# kqueue on macOS (`backend.cplus`) and inotify on Linux
# (`backend_linux.cplus`). The seam is five verbs wide and the engine above it
# is the same code on both — a snapshot differ, so neither backend's event
# payload reaches the public module. Windows would be a third file.

[dependencies]
stdlib = "*"
events = "*"
