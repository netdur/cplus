[package]
name    = "facet_device"
version = "0.0.1"
edition = "2026"

# facet_device — what the DEVICE can do, and whether the user has allowed it.
#
#   facet_device/permissions   ask before using a camera, a microphone, a
#                              location; never guess
#
# THE TIER BOUNDARY IS THE POINT, and it is `facet_agent`'s reasoning applied
# to a second optional surface: an app that never imports facet_device links
# none of it. That matters more here than it does for the agent, because the
# stacks a capability drags in are large and platform-specific — AVFoundation
# and CoreLocation on macOS, a D-Bus round trip on Linux — and facet's own
# slice must carry none of them.
#
# It is NOT part of facet's contract. `vendor/facet/src` is generated by
# `tools/gen_contract.py` and is the UI vocabulary: 57 modules, every one a
# widget, a layout or a theme. A camera is not a widget, and a hand-written
# module in that directory would survive exactly until the next regen.
#
# WHAT IS HERE IS ONE SLICE. `permissions` answers the question that gates
# every capability; the capabilities themselves — opening a camera, reading a
# sensor — are not built. See MANIFEST.md before trusting an adjective.

[build]
prebuild = false

[dependencies]
stdlib = "*"

# The Linux answer is the XDG DESKTOP PORTAL over D-Bus, which `gio` already
# binds — so on this platform the tier drags in nothing that a facet GTK app
# was not linking anyway.
[linux.dependencies]
gio         = "*"
glib        = "*"
gobject     = "*"
gobject_gir = "*"
gmodule     = "*"
