[package]
name    = "agent_gtk"
version = "0.0.1"
edition = "2026"

# The GTK 4 backend for the agent surface — the Linux/BSD counterpart to
# `vendor/agent_appkit` (AppKit) and `vendor/agent_win32` (Win32). Walks a live
# GtkWidget hierarchy into the agent-core identity tree and emits a `describe_ui`
# snapshot, then gates click / set_text / focus through agent-core's
# authorization brain. Depends on agent_core (the headless, framework-neutral
# id/role/surface model); the live introspection uses plain GTK/GObject C calls
# (gtk_widget_get_first_child / g_type_name_from_instance / gtk_editable_get_text
# / …) and `gtk/convert` for the str↔char* bridges.
#
# ---- what is answered, and what is not ---------------------------------------
#
#   describe / describe_exposed   the identity tree, curated and full
#   click                         per class, and MEASURED — see `press`
#   set_text                      with optimistic concurrency
#   navigate                      keyboard focus
#   set_caret                     byte offsets converted to characters
#   hit_test                      gtk_widget_pick from the node's own centre
#   wired                         ANSWERED, not `None`: g_signal_has_handler_pending
#                                 over the same branches `press` drives, so the
#                                 wire tells a live control from a dead one
#
#   read_runs                     NOT ANSWERED. Reading how text is DRAWN means
#                                 walking a PangoAttrList off the layout, run by
#                                 run, and mapping each attribute back to
#                                 agent-core's vocabulary. It reports
#                                 `supported: false` rather than a plausible
#                                 answer — the same rule the `clickable` field
#                                 exists for.
#   invoke_menu                   NOT ANSWERED. facet_gtk's app menu is a GMenu
#                                 whose items are ACTIONS addressed by name, so
#                                 the path-to-action mapping lives there, not
#                                 here. It answers NotFound.
#
# `cpc test` runs both halves of the suite; the LIVE half is gated on
# `gtk_init_check` and says so when it skips, because a green suite that tested
# nothing is the failure the package exists to prevent.
[dependencies]
stdlib     = "*"
gobject    = "*"
agent_core = "*"

# The same GTK 4 stack `vendor/gtk` links — agent_gtk calls `gtk_*` / `g_*`
# symbols directly. On Debian/Ubuntu install `libgtk-4-dev`. The loader resolves
# pango/cairo/graphene/… transitively from their NEEDED entries.
[link]
libs = ["gtk-4", "gobject-2.0", "gio-2.0", "glib-2.0"]
