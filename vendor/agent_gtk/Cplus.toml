[package]
name    = "agent_gtk"
version = "0.0.1"
edition = "2026"

# The GTK 4 backend for the agent surface — the Linux/BSD counterpart to
# `vendor/agent_appkit` (AppKit) and `vendor/agent_win32` (Win32). Walks a live
# GtkWidget hierarchy into the agent-core identity tree and emits a `describe_ui`
# snapshot, then gates click / set_text / focus through agent-core's
# authorization brain. Depends on agent_core (the headless, framework-neutral
# id/role/surface model); the live introspection uses plain GTK/GObject C calls
# (gtk_widget_get_first_child / g_type_name_from_instance / gtk_editable_get_text
# / …) and `gtk/convert` for the str↔char* bridges.
#
# ---- what is answered, and what is not ---------------------------------------
#
#   describe / describe_exposed   the identity tree, curated and full
#   click                         per class, and MEASURED — see `press`
#   set_text                      with optimistic concurrency
#   navigate                      keyboard focus, then SCROLL — geometry where
#                                 the node is allocated, and for a virtualised
#                                 row below the fold the model index off
#                                 facet_gtk's own row-slot key
#   set_caret                     byte offsets converted to characters
#   hit_test                      gtk_widget_pick from the node's own centre
#   wired                         ANSWERED, not `None`: g_signal_has_handler_pending
#                                 over the same branches `press` drives, so the
#                                 wire tells a live control from a dead one
#
#   read_runs                     ANSWERED for GtkLabel: the PangoAttrList off
#                                 the layout, walked as maximal uniform
#                                 stretches, with the base font description
#                                 folded in so a label made bold BY CSS does not
#                                 report `is_bold: false`. GtkEditable has no
#                                 public layout accessor and GtkTextView styles
#                                 through tags, so both report
#                                 `supported: false` rather than an empty run
#                                 list — the same rule the `clickable` field
#                                 exists for.
#   invoke_menu                   ANSWERED. `Menu/Item` is matched against the
#                                 GtkPopoverMenuBar's GMenuModel — the model is
#                                 there whether or not a menu is open, which the
#                                 item WIDGETS are not — and sections are
#                                 flattened, because a person cannot see them.
#                                 A DISABLED item answers NotActionable: a
#                                 disabled GSimpleAction activates silently, so
#                                 without the check the verb reports success for
#                                 a greyed-out command.
#
# `cpc test` runs both halves of the suite; the LIVE half is gated on
# `gtk_init_check` and says so when it skips, because a green suite that tested
# nothing is the failure the package exists to prevent.
[dependencies]
stdlib     = "*"
gobject    = "*"
agent_core = "*"

# The same GTK 4 stack `vendor/gtk` links — agent_gtk calls `gtk_*` / `g_*`
# symbols directly. On Debian/Ubuntu install `libgtk-4-dev`. The loader resolves
# cairo/graphene/… transitively from their NEEDED entries.
#
# PANGO IS NAMED, and is not one of those: `read_runs` calls `pango_*` directly
# to walk a label's attribute list, and a direct call needs the library on the
# link line however the transitive NEEDED graph happens to look — the linker
# says `DSO missing from command line` rather than resolving it.
[link]
libs = ["gtk-4", "gobject-2.0", "gio-2.0", "glib-2.0", "pango-1.0"]
