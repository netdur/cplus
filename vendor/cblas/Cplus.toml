[package]
name    = "cblas"
version = "0.0.1"
edition = "2026"

# Auto-generated by cpc-bindgen --cpackage (C headers -> C+ FFI).
# Headers:   /usr/include/x86_64-linux-gnu/cblas.h
# Reproduce: cpc-bindgen --cpackage --out vendor/cblas --pkg openblas --header /usr/include/x86_64-linux-gnu/cblas.h
# Windows:   src/cblas_windows.cplus, from OpenBLAS 0.3.34's Windows release (see README); run in its root:
#            cpc-bindgen --cpackage --out vendor/cblas --variant windows --header include/cblas.h --clib openblas --skip cblas_bgemm --skip cblas_bgemv --skip cblas_cgemm_batch_strided --skip cblas_dbf16tod --skip cblas_dgemm_batch_strided --skip cblas_sbdot --skip cblas_sbdtobf16 --skip cblas_sbf16tos --skip cblas_sbgemm --skip cblas_sbgemm_batch --skip cblas_sbgemm_batch_strided --skip cblas_sbgemv --skip cblas_sbstobf16 --skip cblas_sgemm_batch_strided --skip cblas_shgemm --skip cblas_zgemm_batch_strided --skip openblas_set_num_threads_local -- -I include

[dependencies]
stdlib = "*"

# The library's name and directory default to Debian's OpenBLAS; elsewhere set
# OPENBLAS_LIB (and on Windows OPENBLAS_NAME=libopenblas, the import library
# OpenBLAS's release ships) - see README.
[link]
libs = ["${OPENBLAS_NAME:-openblas}"]
search-paths = ["${OPENBLAS_LIB:-/usr/lib/x86_64-linux-gnu/openblas-pthread/}"]
