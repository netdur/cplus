[package]
name    = "win32"
version = "0.0.1"
edition = "2026"

# C+ bindings for the native Win32 GUI API — the Windows counterpart to
# `vendor/appkit` (macOS) and `vendor/gtk` (Linux). Unlike GTK, this needs
# NOTHING installed: user32/gdi32 ship with every Windows install and are on
# the linker's default search path, so `cpc build` works out of the box on
# `x86_64-pc-windows-msvc`.
#
# Like the GTK bindings (and unlike Cocoa's objc_msgSend), these are direct
# `extern fn` calls to `user32`/`gdi32` symbols — thin C+ structs over the
# opaque HWND/HINSTANCE handles. The ANSI (`*A`) entry points are used so
# plain NUL-terminated C+ strings pass straight through (no UTF-16).
[dependencies]
stdlib = "*"

[link]
# The four the hand-written GUI facade needs, plus three the GENERATED modules
# reach into: `wingdi.h` declares the `wgl*` family (opengl32), AlphaBlend /
# GradientFill / TransparentBlt (msimg32) and DeviceCapabilities (winspool).
# Binding a header binds everything it declares, so the link line has to cover
# everything it declares. All seven ship with Windows and sit on the default
# search path, so this still needs nothing installed.
libs = ["user32", "gdi32", "comctl32", "comdlg32", "opengl32", "msimg32", "winspool"]
