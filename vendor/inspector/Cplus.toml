[package]
name    = "inspector"
version = "0.0.1"
edition = "2026"

# inspector — a developer-only live inspector for a mounted facet tree.
#
# - inspector/inspector: the neutral surface (Handle, Value, Prop, Backend vtable)
# - inspector/tree:      the facet-tree walker and the typed get/set dispatch
# - inspector/appkit:    highlight overlay and native rows (macOS)
# - inspector/uikit:     the same two, on iOS — and `serve_if_asked` there takes
#                        a PORT, because a Unix socket inside the app sandbox is
#                        unreachable from the machine running the IDE
# - inspector/serve_android: the same two again, on Android — where the port
#                        arrives as the system property `debug.facet.inspect`,
#                        because an Activity has no environment to set
# - inspector/widget:    the facet-facing inspector UI applications embed
#
# This is NOT the agent surface. The agent surface is curated and permissioned;
# this one sees unexposed nodes and writes properties that are not user
# affordances. See docs/design.md.

[dependencies]
stdlib      = "*"
flex_layout = "*"
facet       = "*"
facet_agent = "*"
objc        = "*"
appkit      = "*"
json        = "*"
agent_mcp   = "*"
agent_core  = "*"
quartzcore  = "*"

# The suite imports facet, and on macOS facet's runtime facade imports its
# backend — which pulls webkit and the agent backends behind it. A transitive
# platform dependency is resolved against the ROOT package's manifest, so
# without these four the suite does not build at all. Same list the probe
# under `examples/inspector_probe` declares, and for the same reason.
[macos.dependencies]
facet_appkit = "*"
webkit       = "*"
agent_appkit = "*"
agent_inapp  = "*"

# The iOS half. `uikit.cplus` is only ever compiled by a build that imports it —
# an iOS entry — so these are named for that build rather than for this
# package's own, which is macOS and never reaches the file.
[ios.dependencies]
facet_uikit = "*"
uikit       = "*"
webkit      = "*"
agent_uikit = "*"
agent_inapp = "*"

# The Android half. `serve_android.cplus` is only ever compiled by a build that
# imports it, so these are named for that build rather than for this package's
# own — same reason as the iOS block above.
#
# `agent_android` is here because `facet_agent/agent` resolves to its Android
# facade, which is written against that backend; the flat set the resolver
# checks every import against is taken from the ROOT package's manifest, so a
# transitive dependency of a dependency is still this file's to name.
[android.dependencies]
facet_android = "*"
android_view  = "*"
jni           = "*"
agent_android = "*"
agent_inapp   = "*"
