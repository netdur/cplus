[package]
name    = "biometrics"
version = "0.0.1"
edition = "2026"

# biometrics — ask the person to prove they are the owner of the device.
#
# NOT A PERMISSION, which is why it is not in `permissions`. A permission is
# asked once and remembered; this is asked every time and answered by a finger
# or a face. It also cannot be granted in Settings — there is nothing to grant.
#
# AND NOT AUTHENTICATION. A successful check means "the person holding the
# device is its owner", never "this user is who they claim to be to your
# server". Anything that needs the second wants a token, and `securestore` is
# where that token lives — gate it behind this rather than replacing it.

[dependencies]
stdlib = "*"

[macos.dependencies]
objc                = "*"
localauthentication = "*"

[ios.dependencies]
objc                = "*"
localauthentication = "*"

[android.dependencies]
jni           = "*"
android_view  = "*"
facet         = "*"
facet_android = "*"
flex_layout   = "*"
events        = "*"
