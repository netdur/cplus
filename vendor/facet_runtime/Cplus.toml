[package]
name    = "facet_runtime"
version = "0.0.1"
edition = "2026"

# facet_runtime — the boot facade. `import "facet_runtime/runtime"` starts an
# app: the resolver's platform override on the filename picks runtime_macos /
# runtime_ios beside the neutral base, and that file installs the matching
# backend into facet's seams. This is the package that knows all the parts,
# so it sits ABOVE all the parts: facet knows no backend, backends know no
# facade, every arrow points down — which is what dissolved the old
# facet <-> facet_appkit dependency cycle and made the family prebuildable
# (2026-08-17).
#
# The suite guarantee moved here with the files: test_main imports ./runtime,
# so the active platform's backend compiles in this package's own build — a
# backend that does not build turns facet_runtime red, exactly as it used to
# turn facet red.

[dependencies]
stdlib      = "*"
flex_layout = "*"
facet       = "*"
# facet's transitive closure, restated: the resolver validates every import
# in a build against ONE flat set taken from the consuming manifest.
events      = "*"

[macos.dependencies]
facet_appkit = "*"
# facet_appkit's transitive deps — same flat-set rule.
objc       = "*"
appkit     = "*"
quartzcore = "*"
webkit     = "*"

[linux.dependencies]
facet_gtk   = "*"
# facet_gtk's transitive deps — same flat-set rule.
gtk4        = "*"
gobject     = "*"
gobject_gir = "*"
gio         = "*"
glib        = "*"
cairo       = "*"
gdk         = "*"
gdkpixbuf   = "*"
graphene    = "*"
gsk         = "*"
harfbuzz    = "*"
pango       = "*"
pangocairo  = "*"
gmodule     = "*"

[ios.dependencies]
facet_uikit = "*"
objc        = "*"
uikit       = "*"
quartzcore  = "*"
webkit      = "*"

# SOURCE MODE ON ANDROID, and it is a PREFERENCE — measured, not assumed.
#
# It used to be forced. `facet_android` is source mode by its own decision, so
# prebuilding this facade for Android compiled 831 facet_android symbols INTO a
# single-object `libfacet_runtime.a`; an app must also declare `facet_android`
# (the header imports `facet_android/log`, and the flat-set rule requires it),
# so its three `export extern fn` JNI entry points existed in two archives, and
# a JNI entry point cannot be weak because Java finds it by NAME. Every Android
# app failed to link on a duplicate symbol.
#
# That forcing is gone: a package archives one object per module now
# (cplus-core/src/split.rs), and a prebuilt facade verified to link, install and
# run on the emulator — the archive member holding the entry points is simply
# never pulled in, because the app's own copy already satisfies every reference.
#
# What remains is the reason this key exists at all: prebuilding buys compile
# time on a LARGE package and costs it on a small one, which is a per-platform
# judgement rather than a global one. On Android this facade is small and
# changes with its backend, so it compiles in.
#
# History: `bugs/closed/the-android-gallery-cannot-link-three-pre-existing-blockers.md`.
[android.build]
prebuild = false

[android.dependencies]
facet_android = "*"
android_view  = "*"
jni           = "*"

[windows.dependencies]
facet_win32 = "*"
# facet_win32's transitive deps — same flat-set rule: the resolver validates
# every import in a build against ONE flat set taken from the consuming
# manifest, so a tier's own dependencies are not enough.
win32       = "*"
