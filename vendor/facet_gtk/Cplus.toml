[package]
name    = "facet_gtk"
version = "0.0.1"
edition = "2026"

# facet_gtk — facet's GTK 4 backend, the Linux/BSD counterpart of
# facet_appkit. facet owns the description tree and all layout (the shared
# flex_layout engine); this package answers the contract's verbs with GTK, and
# records in MANIFEST.md the ones GTK cannot.
#
#   facet_gtk   the registration surface: install() and nothing else
#   views       the Renderer's five verbs
#   controls    one GTK body per node kind, and the CSS each one composes
#   input       the READ half: gestures, keys, control actions, sender readers
#   paint       the shared band (background / radius / opacity / enabled / tooltip)
#   geometry    computed frames -> GtkFixed placements, and a scroll's extent
#   scheduler   schedule + the Scheduler service, over the GLib main loop
#   window      the GtkWindow host, the run loop, and the menus
#   chrome      toolbar items, the window buttons, the window-drag region
#   swipe       swipe-to-reveal, assembled — GTK has no such row
#   anim        a progress tween and a GIF's frames — GTK animates neither
#   recycler    list, collection and tree over GtkListView, and the two slot maps
#   dialogs     alert / choose / prompt as facet trees, and the file chooser
#   drawing     the canvas replay, against cairo and Pango
#   web         a WebKitGTK view, opened at runtime rather than linked
#
# STATUS is a MEASUREMENT, not a claim: `python3 tools/parity.py` prints the
# share of facet's declared prop bits this backend references, beside appkit
# and uikit. Read MANIFEST.md before trusting any adjective about it.
#
# Built and RUN on Linux/GTK. That is new as of 2026-08-23: the previous
# generation of this package could only ever be type-checked, because the GTK
# stack did not link.

# Not prebuilt: this backend is early and changes constantly, and a stale slice
# is worse than a slower build. Revisit when the coverage number settles.
[build]
prebuild = false

[dependencies]
stdlib      = "*"
flex_layout = "*"
facet       = "*"
# GTK 4 typed binding + its transitive stack (flat-vendor: the closure the
# build touches must be declared here, resolved from sibling vendor/ dirs).
gtk4        = "*"
gobject     = "*"
gobject_gir = "*"
gio         = "*"
glib        = "*"
cairo       = "*"
gdk         = "*"
gdkpixbuf   = "*"
graphene    = "*"
gsk         = "*"
harfbuzz    = "*"
pango       = "*"
pangocairo  = "*"
gmodule     = "*"

[link]
# fontconfig is not an extra dependency: it is how GTK finds fonts on Linux and
# is already in the closure through pango. It is named here because
# `controls::register_bundled_font` calls it DIRECTLY, and GNU ld resolves a
# direct reference only from a library on the command line — being a
# DT_NEEDED of pangoft2 is not enough.
# pangoft2 for the same reason: `pango_fc_font_map_config_changed` is the one
# call that makes an app font visible to a fontmap that has already cached its
# family list.
libs = ["gtk-4", "fontconfig", "pangoft2-1.0"]
