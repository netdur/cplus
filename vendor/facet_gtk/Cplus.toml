[package]
name    = "facet_gtk"
version = "0.0.1"
edition = "2026"

# facet_gtk — facet's GTK 4 backend, the Linux/BSD counterpart of
# facet_appkit. facet owns the description tree and all layout (the shared
# flex_layout engine); this package answers the contract's verbs with GTK, and
# records in MANIFEST.md the ones GTK cannot.
#
#   facet_gtk   the registration surface: install() and nothing else
#   views       the Renderer's five verbs
#   controls    one GTK body per node kind
#   paint       the shared band (background / radius / opacity / enabled / tooltip)
#   geometry    computed frames -> GtkFixed placements
#   scheduler   schedule + the Scheduler service, over the GLib main loop
#   window      the GtkWindow host a root is laid into
#
# STATUS is a MEASUREMENT, not a claim: `python3 tools/parity.py` prints the
# share of facet's declared prop bits this backend references, beside appkit
# and uikit. Read MANIFEST.md before trusting any adjective about it.
#
# Built and RUN on Linux/GTK. That is new as of 2026-08-23: the previous
# generation of this package could only ever be type-checked, because the GTK
# stack did not link.

# Not prebuilt: this backend is early and changes constantly, and a stale slice
# is worse than a slower build. Revisit when the coverage number settles.
[build]
prebuild = false

[dependencies]
stdlib      = "*"
flex_layout = "*"
facet       = "*"
# GTK 4 typed binding + its transitive stack (flat-vendor: the closure the
# build touches must be declared here, resolved from sibling vendor/ dirs).
gtk4        = "*"
gobject     = "*"
gobject_gir = "*"
gio         = "*"
glib        = "*"
cairo       = "*"
gdk         = "*"
gdkpixbuf   = "*"
graphene    = "*"
gsk         = "*"
harfbuzz    = "*"
pango       = "*"

[link]
libs = ["gtk-4"]
