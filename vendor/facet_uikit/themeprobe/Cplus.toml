[package]
name    = "facet_uikit_themeprobe"
version = "0.0.1"
edition = "2026"

# The live app half of the theme matrix check — see tools/run_theme_matrix.sh.
#
# WHY IT IS NOT IN `tests/`. That package is a RUNNER: `main` runs the checks,
# prints them and returns a count, and it deliberately never calls
# UIApplicationMain because "an app that never exits cannot report a failure to
# a shell". Every question this package asks is about what happens to a LIVE
# app when a device setting changes underneath it, so it has to be the thing
# that runner refuses to be. Keeping them apart keeps that reasoning intact.
#
# WHY IT IS NOT IN `playground/`. That directory is gitignored. The appearance
# flip was verified by a disposable probe and a screenshot, and the reading was
# gone by the next session — which is exactly how it came to be verified twice,
# wrongly the first time. This one is committed so the measurement survives.
[ios]
entry = "src/main.cplus"

# The resolver validates every import against ONE flat set taken from THIS
# manifest, so the backend's whole closure is named here too.
[dependencies]
stdlib        = "*"
facet         = "*"
facet_runtime = "*"
flex_layout   = "*"

# facet_uikit's OWN closure is named here too, not just what this file imports.
# The resolver validates every import against ONE flat set taken from THIS
# manifest, so a backend dependency the probe never mentions — webkit, the agent
# tier — still has to appear or the backend's own modules fail to resolve.
[ios.dependencies]
facet_uikit = "*"
objc        = "*"
uikit       = "*"
quartzcore  = "*"
webkit      = "*"
agent_uikit = "*"
agent_core  = "*"
agent_mcp   = "*"
json        = "*"
