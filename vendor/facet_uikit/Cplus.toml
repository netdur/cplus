[package]
name    = "facet_uikit"
version = "0.0.1"
edition = "2026"

# facet_uikit — facet's UIKit backend, the iOS counterpart of facet_appkit.
#
# It reads facet's contract and implements it with UIKit, or states plainly
# that UIKit cannot (MANIFEST.md holds every "cannot" and every "not yet").
# Nothing else lives here: no second vocabulary, no side door that looks
# portable.
#
# The registration surface is the same one facet_appkit fills, and no wider:
#   mount::install(Renderer)                 create / apply / insert / remove / schedule
#   services::install_scheduler(Scheduler)   run_on_main / after / observe_size
#   theme::set_is_dark_fn                    the system appearance read
#   theme::set_theme_changed_fn              repaint the running app's chrome
# A hook family appearing outside those is drift by definition.
#
# STATUS: builds for `--target ios-arm64` and the simulator, and RUNS in the
# simulator — examples/facet_gallery_ios links against it. Not on a device.
# Prop parity with facet_appkit is 305/318; MANIFEST.md §1 is the difference.

# A library package: no entry, no section. `cpc build --target ios-arm64`
# archives the whole src/ tree. The structural tests live inside `views.cplus`
# rather than in a test root so the iOS build compiles every line of them.

# Not prebuilt (2026-08-17): with this backend as a SLICE (facet as source),
# facet_gallery segfaults at first window order-front — a ~8 MB single stack
# frame inside flex_layout Node code reached from AppKit's key-view walk
# (write into the stack guard). Source mode is the verified-alive
# configuration; see bugs/facet-appkit-slice-runtime-crash.md before
# re-enabling. The facet <-> backend CYCLE is gone (facet_runtime owns the
# facades) — this opt-out is about the mixed slice/source ObjC path only.
[build]
prebuild = false

[dependencies]
stdlib      = "*"
objc        = "*"
quartzcore  = "*"
uikit       = "*"
flex_layout = "*"
facet       = "*"
webkit      = "*"
agent_uikit = "*"
agent_core  = "*"
agent_mcp   = "*"
json        = "*"
