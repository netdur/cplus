[package]
name    = "cuda"
version = "0.0.1"
edition = "2026"

# Auto-generated by cpc-bindgen --cpackage (C headers -> C+ FFI).
# Headers:   /usr/local/cuda/include/cuda_runtime_api.h, /usr/local/cuda/include/cublas.h
# Reproduce: cpc-bindgen --cpackage --out vendor/cuda --header /usr/local/cuda/include/cuda_runtime_api.h --header /usr/local/cuda/include/cublas.h --clib cudart --clib cublas --search-path ${CUDA_LIB:-/usr/local/cuda/lib64} -- -I/usr/local/cuda/include
# Windows:   src/*_windows.cplus, from the Windows toolkit's headers - see README:
#            cpc-bindgen --cpackage --out vendor/cuda --variant windows --header %CUDA_PATH%/include/cuda_runtime_api.h --header %CUDA_PATH%/include/cublas.h --clib cudart --clib cublas --skip cudaDeviceGetNvSciSyncAttributes -- -I %CUDA_PATH%/include

[dependencies]
stdlib = "*"

[link]
libs = ["cudart", "cublas"]
search-paths = ["${CUDA_LIB:-/usr/local/cuda/lib64}"]
