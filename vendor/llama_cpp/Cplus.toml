[package]
name    = "llama_cpp"
version = "0.0.2"
edition = "2026"

# C+ bindings for upstream llama.cpp's C API.
#
# `src/raw.cplus` and `src/mtmd_raw.cplus` are GENERATED by `./build.sh` from
# llama.cpp's own `include/llama.h` and `tools/mtmd/mtmd.h`. Do not hand-edit
# them, and do not reintroduce a curated copy of the headers: a second copy of
# a struct layout drifts silently, and this package shipped for months with a
# `llama_model_params` that was missing two fields upstream had added.
#
# llama.cpp has no standard install location, so point cpc at your build's
# library directory via the LLAMA_CPP_LIB environment variable, e.g.
#
#   export LLAMA_CPP_LIB="$HOME/Workspace/llama.cpp/build/bin"
#
# `cpc build` expands `${LLAMA_CPP_LIB}` below into the `-L` / `-rpath` link
# args; if it is unset you get a clear E0865 telling you to set it (rather
# than an opaque "library not found" from the linker). The rpath is what lets
# `libllama` find its own `@rpath/libggml*.dylib` siblings at run time, so
# they are not listed here.
[link]
frameworks    = ["Foundation", "Metal", "Accelerate"]
libs          = ["llama", "mtmd"]
search-paths  = ["${LLAMA_CPP_LIB}"]

[dependencies]
stdlib = "*"
