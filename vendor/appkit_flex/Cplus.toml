[package]
name    = "appkit_flex"
version = "0.0.1"
edition = "2026"

# Test/demo root: its import closure covers the package, so `cpc test`
# runs the `@ui`-syntax tests (test_main) plus the module tests (appkit_flex).
[[bin]]
name = "appkit_flex_tests"
path = "src/test_main.cplus"

[dependencies]
stdlib      = "*"
objc        = "*"
quartzcore  = "*"
appkit      = "*"
flex_layout = "*"
