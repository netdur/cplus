[package]
name    = "terminal"
version = "0.0.1"
edition = "2026"

# Portable terminal-facing API:
# - terminal/terminal: bounded, ANSI-aware transcript model — PORTABLE, and the
#                      bulk of the package
# - terminal/pty:      pseudo-terminal session (POSIX forkpty on macOS/Linux;
#                      the Windows sibling refuses — ConPTY is the road)
# - terminal/backend:  the live widget (AppKit on macOS, GTK 4 on Linux; the
#                      Windows sibling refuses and explains the missing work)
# - terminal/widget:   the facet-facing facade applications use
#
# THE APPLE PACKAGES ARE NOT TOP-LEVEL, and that is what kept this package off
# every other platform. A top-level dependency splices its `[link]` entry on
# EVERY target, so a Windows build was handed `-framework AppKit` and stopped at
# the linker even once the imports were sorted out — the same trap
# `vendor/inspector` was in. Only `backend.cplus` reaches them, and it only
# compiles on macOS.

[dependencies]
stdlib      = "*"
flex_layout = "*"
facet       = "*"
events      = "*"

[macos.dependencies]
objc       = "*"
appkit     = "*"
quartzcore = "*"

# The GTK pane, and the stack it draws with. `backend_linux.cplus` is the only
# file that reaches any of it, and it only compiles on Linux — the same
# arrangement the Apple packages have above, and for the same reason: a
# top-level dependency splices its `[link]` entry on EVERY target.
[linux.dependencies]
facet_gtk   = "*"
gtk4        = "*"
gobject     = "*"
gobject_gir = "*"
gio         = "*"
glib        = "*"
cairo       = "*"
gdk         = "*"
gdkpixbuf   = "*"
graphene    = "*"
gsk         = "*"
harfbuzz    = "*"
pango       = "*"
pangocairo  = "*"
gmodule     = "*"

# The resolver validates every import in a build against ONE flat set taken from
# the consuming manifest, and facet's runtime facade reaches its backend on
# whatever platform it is built for.
[windows.dependencies]
facet_win32 = "*"
win32       = "*"
