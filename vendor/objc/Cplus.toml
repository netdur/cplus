[package]
name    = "objc"
version = "0.0.0"
edition = "2026"

# objc — shared Objective-C runtime for C+ (msgSend, bridge, synthesis).
# Foundation + libobjc. See docs/.

[dependencies]
stdlib = "*"

# The runtime is Apple's: libobjc and Foundation exist on macOS and iOS only.
# Scoped per platform so a consumer that lists `objc` unscoped and builds for
# Android (or Linux) is not handed `-lobjc`, which no other toolchain has.
[macos.link]
frameworks = ["Foundation"]
libs       = ["objc"]

[ios.link]
frameworks = ["Foundation"]
libs       = ["objc"]
