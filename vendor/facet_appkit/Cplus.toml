[package]
name    = "facet_appkit"
version = "0.0.1"
edition = "2026"

# facet_appkit — facet's AppKit backend.
#
# It reads facet's contract and implements it with AppKit, or states plainly
# that AppKit cannot (MANIFEST.md holds every "cannot"). Nothing else lives
# here: no second vocabulary, no side door that looks portable. INTENT.md is
# the judge.
#
# The whole seam is five structs and two slots, filled once by `install()`:
#   mount::install(Renderer)                 create / apply / insert / remove / schedule
#   services::install_scheduler(Scheduler)   run_on_main / after / observe_size
#   gestures::install_key_reader(KeyReader)
#   component::install_sender_readers(SenderReaders)
#   application::install_agent(AgentHooks)
#   theme::set_is_dark_fn / theme::set_theme_changed_fn
# A hook family appearing outside those is drift by definition.

# The test root doubles as the leak harness (`leaks --atExit`).

# Prebuilt again (2026-08-17). This backend was opted OUT because as a SLICE it
# made divergent view-arming decisions and the app died in AppKit's key-view
# walk — an ~8 MB stack, write into the guard page, at first window
# order-front. That is fixed in the COMPILER, not here.
#
# The cause was function-pointer identity. facet is source-mode, so its code was
# compiled `internal` into the app and `weak_odr` into this slice; the linker
# cannot coalesce those, so `props::no_handler` had TWO addresses. facet parks
# `no_handler` in a handler slot and compares against it to mean "the
# application set nothing" — written through one copy and compared against the
# other, that answered "it DID set one" for every node, so every view was armed
# for focus events, isa-swizzled into a gesture subclass, and the key-view ring
# built over them recursed until the stack ran out.
#
# `gen_fn` now gives any address-taken, name-public function `weak_odr`, so it
# has one address. Verified in this configuration: one `no_handler` symbol
# instead of two, 0 views armed at boot instead of 6 (matching source mode's 72
# skips), and the gallery runs. bugs/closed/facet-appkit-slice-runtime-crash.md
# has the forensic record.
[build]
prebuild = true

[dependencies]
stdlib      = "*"
objc        = "*"
quartzcore  = "*"
appkit      = "*"
flex_layout = "*"
facet       = "*"
webkit      = "*"
