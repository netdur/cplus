[package]
name    = "facet_appkit"
version = "0.0.2"
edition = "2026"

# facet_appkit — the AppKit `Renderer` for facet, over appkit_flex: three leaf
# vtable ops (label / wrap_label / button) delegating to the typed widget
# constructors, plus `mount_into` and the `run` window host. facet owns the
# tree walk and all layout (shared flex engine).

# Test root doubles as the leak harness (`leaks --atExit`).
[[bin]]
name = "facet_appkit_tests"
path = "src/test_main.cplus"

[dependencies]
stdlib      = "*"
objc        = "*"
quartzcore  = "*"
appkit      = "*"
flex_layout = "*"
appkit_flex = "*"
facet       = "*"
