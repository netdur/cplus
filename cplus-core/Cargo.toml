[package]
name = "cplus-core"
version = "0.0.26"
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# CWE-377 hardening: `#compile_shader` writes Metal intermediates into a
# private mkdtemp() directory (0700, auto-cleaned) instead of predictable
# shared-/tmp paths. Same crate the driver uses for `cpc-{pid}.ll`.
tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# wasm playground slice (plans/plan.wasm-playground.md): assemble the emitted
# WAT (`wat`) and run it in a pure-Rust interpreter (`wasmi`) so the
# compile→assemble→run path is verified in CI with no browser or toolchain.
wat = "1"
wasmi = "0.31"
