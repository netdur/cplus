[package]
name    = "facet_gallery"
version = "0.0.1"
edition = "2026"

# Facet Gallery — a Flutter Gallery–style catalog of facet widgets.
# Browse demos from the home screen; each route is an interactive sample.

[dependencies]
stdlib      = "*"
facet       = "*"
facet_runtime = "*"
flex_layout = "*"
events      = "*"

[linux.dependencies]
facet_gtk   = "*"
gtk4        = "*"
gobject     = "*"
gobject_gir = "*"
gio         = "*"
glib        = "*"
cairo       = "*"
gdk         = "*"
gdkpixbuf   = "*"
graphene    = "*"
gsk         = "*"
harfbuzz    = "*"
pango       = "*"
pangocairo  = "*"
gmodule     = "*"

[macos.dependencies]
facet_appkit = "*"
objc         = "*"
appkit       = "*"
quartzcore   = "*"
webkit       = "*"
