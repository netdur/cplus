[package]
name    = "glass_music_ios"
version = "0.0.1"
edition = "2026"
app_id  = "dev.cplus.glassmusic"

[ios]
entry = "src/main_ios.cplus"

[macos]
entry = "src/main.cplus"

[android]
entry = "src/main_android.cplus"

[dependencies]
stdlib        = "*"
facet         = "*"
facet_runtime = "*"
flex_layout   = "*"
events        = "*"

# facet's iOS backend and everything it imports. The resolver checks
# every import against this one flat set, so the closure is named here.
[ios.dependencies]
facet_uikit = "*"
uikit       = "*"
objc        = "*"
quartzcore  = "*"
webkit      = "*"

# What the agent surface in src/app.cplus links, named here for
# the same flat-set reason as the backend's own closure.
inspector   = "*"
facet_agent = "*"
agent_uikit = "*"
agent_core  = "*"
agent_inapp = "*"
agent_mcp   = "*"
json        = "*"

# facet's AppKit backend and its closure.
[macos.dependencies]
facet_appkit = "*"
appkit       = "*"
objc         = "*"
quartzcore   = "*"
webkit       = "*"
inspector    = "*"
facet_agent  = "*"
agent_appkit = "*"
agent_core   = "*"
agent_inapp  = "*"
agent_mcp    = "*"
json         = "*"

# facet's Android backend and its closure. The Activity the manifest names
# ships inside facet_android as a precompiled dex.
[android.dependencies]
facet_android = "*"
android_view  = "*"
jni           = "*"
inspector     = "*"
facet_agent   = "*"
agent_android = "*"
agent_core    = "*"
agent_inapp   = "*"
agent_mcp     = "*"
json          = "*"
