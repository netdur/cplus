[package]
name = "facet_runtime_winui"
version = "0.0.1"
edition = "2026"

# A `runtime::App` with two windows, run on WinUI - the Windows backend -
# through the facade. The source names no backend.
#
#   & examples/facet_runtime_winui/build.ps1
#   & examples/facet_runtime_winui/out/runtime/facet_runtime_winui.exe

[dependencies]
stdlib        = "*"
facet         = "*"
facet_runtime = "*"
flex_layout   = "*"
events        = "*"

[windows.dependencies]
# facet_runtime's Windows closure: WinUI, the default backend, and win32 for
# the shell services.
facet_winui = "*"
winui       = "*"
winrt       = "*"
win32       = "*"
# The agent surface over every window (CPLUS_RUNTIME_WINUI_AGENT, see
# src/probe.cplus) and its closure.
facet_agent       = "*"
agent_winui       = "*"
agent_winui_mcp   = "*"
agent_core        = "*"
agent_inapp       = "*"
agent_mcp         = "*"
json              = "*"
