[package]
name = "facet_runtime_win32"
version = "0.0.1"
edition = "2026"

# A `runtime::App` on the DEPRECATED Win32 backend: `facet_runtime/win32`'s
# `select()` opts out of WinUI, the Windows default. Kept to show and test the
# opt-out until facet_win32 is removed (netdu/cplus#20).
#
#   cpc build && target/debug/facet_runtime_win32.exe

[dependencies]
stdlib        = "*"
facet         = "*"
facet_runtime = "*"
flex_layout   = "*"
events        = "*"

[windows.dependencies]
# facet_runtime's Windows closure...
facet_winui = "*"
winui       = "*"
winrt       = "*"
win32       = "*"
# ...and the opt-out: only an app that imports `facet_runtime/win32` lists it.
facet_win32 = "*"
