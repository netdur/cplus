[package]
name    = "facet_gallery_ios"
version = "0.0.1"
edition = "2026"

# The iOS gallery — the phone-shaped counterpart of examples/facet_gallery.
#
# A STATICLIB, not a `[[bin]]`. An iOS target stops at object emission (Xcode
# owns the final link), so a program is not a thing cpc can produce for it:
#
#     cpc build --target ios-arm64-simulator
#     cpc build --target ios-arm64
#
# The entry point Xcode's `ios/main.m` calls is `facet_gallery_ios_main`,
# exported from src/main.cplus and declared in the generated header. README.md
# has the whole Xcode recipe.
#
# The desktop gallery stays a `[[bin]]` and is unaffected: `[[bin]]` and `[lib]`
# are mutually exclusive in one manifest (E0408), which is why this is a
# separate package rather than a second target in that one.
[lib]
crate-type = "staticlib"
path = "src/main.cplus"

[dependencies]
stdlib      = "*"
facet       = "*"
flex_layout = "*"

# The backend and its transitive closure. The resolver validates every import
# in the build against ONE flat set taken from THIS manifest — it does not read
# a dependency's own — so facet_uikit's deps are named here too.
[ios.dependencies]
facet_uikit = "*"
objc        = "*"
uikit       = "*"
quartzcore  = "*"
webkit      = "*"
