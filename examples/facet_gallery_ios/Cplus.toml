[package]
name    = "facet_gallery_ios"
version = "0.0.1"
edition = "2026"

# The iOS gallery — the phone-shaped counterpart of examples/facet_gallery.
#
# The entry is declared in the `[ios]` section, so this package builds for iOS
# and nothing else — `cpc build` on a Mac says so (E0413) instead of guessing.
# What the entry builds INTO is the target's fact: an iOS target stops at
# object emission (Xcode owns the final link), so cpc produces
# `libfacet_gallery_ios.a` plus a C header:
#
#     cpc build --target ios-arm64-simulator
#     cpc build --target ios-arm64
#
# The entry point Xcode's `ios/main.m` calls is `facet_gallery_ios_main`, an
# `export extern fn` in src/main.cplus, declared in the generated header.
# README.md has the whole Xcode recipe.

[ios]
entry = "src/main.cplus"

[dependencies]
stdlib      = "*"
facet       = "*"
flex_layout = "*"

# The backend and its transitive closure. The resolver validates every import
# in the build against ONE flat set taken from THIS manifest — it does not read
# a dependency's own — so facet_uikit's deps are named here too.
[ios.dependencies]
facet_uikit = "*"
objc        = "*"
uikit       = "*"
quartzcore  = "*"
agent_uikit = "*"
agent_core  = "*"
agent_mcp   = "*"
agent_inapp = "*"
json        = "*"
webkit      = "*"
