test = "cplus-core/src/sema.rs:double_underscore_item_names_reserved_e0917"
cause = "A struct, enum, or (non-extern) function name contains an interior `__`. The double underscore is the compiler's monomorphization separator (`Box[i32]` mangles to `Box__i32`), so a literal `Box__i32` next to a `Box[T]` template would collide with the instantiation's symbol — two items under one name, one silently shadowing the other."
fix = "Use a single underscore (`box_i32`). Exempt: `extern fn` names (existing C symbols like `__errno_location` never monomorphize) and names whose only `__` is leading (`__x` — an instantiation's template base is never empty)."
example = '''
struct Box__i32 { v: i32 }
fn main() -> i32 { return 0; }
// -> [E0917] struct name `Box__i32` contains `__`, which is reserved for compiler name mangling
'''

