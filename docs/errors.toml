[[code]]
id = "E0910"
title = "Generic instantiation exceeds the recursion limit"
category = "Generics"
severity = "error"
repro = "checked"
lang = "cplus"
verified = true
emit_site = "cplus-core/src/monomorphize.rs:check_instantiation_bounds, cplus-core/src/sema.rs:reject_oversized_instantiation"
test = "cplus-core/src/monomorphize.rs:self_growing_generic_instantiation_reports_e0910, cplus-core/src/sema.rs:self_growing_struct_generic_reports_e0910_not_oom"
cause = "A generic function calls itself (directly or through a cycle) with a type argument that grows on every step — `rec::[*T]`, `rec::[[T; 2]]`, `rec::[Box[T]]`. Each step is a distinct concrete type, so monomorphization never converges and the compiler would hang. Two limits catch this: a ceiling on the number of instantiations, and a ceiling on the size of any one synthesized type name. A wrapper that names its parameter more than once (`rec::[Pair[T, T]]`) doubles that name at every step, so it hits the size ceiling while the instantiation count is still small."
fix = "Reduce the type argument toward a non-generic base case, or drop the wrapper so the recursive call reuses the same type (`rec::[T]`). Runtime recursion on a value parameter is fine; only the *type* argument must not grow."
example = '''
fn rec[T]() -> i32 { let _z: i32 = rec::[*T](); return 0; }
fn main() -> i32 { return rec::[i32](); }
'''

