[[code]]
id = "E0365"
title = "A value that captured a local's address escapes the frame"
category = "Ownership and borrowing"
severity = "error"
repro = "checked"
lang = "cplus"
verified = true
emit_site = "cplus-core/src/borrowck.rs (ViewRules::check_capture_return / _store / _arg)"
test = "cpc/tests/e2e.rs:a_capture_of_a_local_escaping_the_frame_is_rejected_e0365"
cause = "A bound method reference (`obj.handler` in value position) lowers to a function pointer plus the receiver's raw ADDRESS. When the receiver is storage this frame frees — a local, a `take` parameter, a `take this`, or a by-value parameter of a `Copy` type — and the value holding that address then leaves the frame (returned, stored into a `static` or a `ref` target, or handed to a call), the handler points at a stack slot that is gone before it fires. The analysis is transitive: a method that binds its own receiver taints every value it returns, and a binding that absorbs such a value carries the capture onward."
fix = "Give the receiver storage that outlives the escaping value — a field of `this`, a `static`, or a `Box`. Binding a handler to a local is legal as long as it does not escape; binding to `this` or to a field is always legal, which is why this costs nothing in ordinary component code."
example = '''
struct Child { clicks: i32 }
impl Child {
    fn clicked(ref this) { this.clicks = this.clicks + 1; return; }
    fn build(ref this) -> i32 { return take_handler(this.clicked); }
}
fn take_handler(f: fn(*u8), ctx: *u8 = 0 as *u8) -> i32 { return 1; }
fn make() -> i32 {
    var c: Child = Child { clicks: 0 };
    return c.build();
}
'''

