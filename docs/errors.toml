[[code]]
id = "W0824"
title = "Handler parameter cannot receive a bound method"
category = "Warnings"
severity = "warning"
repro = "checked"
lang = "cplus"
verified = true
emit_site = "cplus-core/src/sema.rs:check_handler_ctx_slots"
test = "cpc/tests/e2e.rs:handler_without_a_ctx_slot_warns_w0824"
cause = "A caller may pass `this.method` where a fn-pointer is expected, but only if the callee declares a `*u8` context parameter IMMEDIATELY after the handler — that is the slot the compiler fills with the receiver's address (E0824). Nothing in the declaration says so, so without this warning the author of a handler-taking function learns the rule from a CALLER hitting E0824 in another file, where it cannot be fixed. Only the wired-handler shape is flagged: a fn-pointer taking at least one real parameter plus a trailing `*u8`. A bare `fn(*u8)` is the release-hook shape and is left alone, as is a handler that already has an adjacent `*u8` (defaulted or not — an undefaulted one is a deliberate `the caller always supplies it` API)."
fix = "Add `<handler>_ctx: *u8 = 0 as *u8` immediately after the handler parameter. Leave it out only if callers are meant to pass free functions and thread the context themselves."
example = '''
struct Row { n: i32 }
impl Row { fn clicked(ref this, sender: str) { this.n = this.n + 1; return; } }

// -> W0824: `on_click` cannot receive a bound method
fn bad(on_click: fn(str, *u8) = 0 as fn(str, *u8)) -> i32 { return 1; }

// the shape that accepts `bad(on_click: row.clicked)`
fn good(on_click: fn(str, *u8) = 0 as fn(str, *u8),
        on_click_ctx: *u8 = 0 as *u8) -> i32 { return 2; }
'''

[[code]]
id = "W0825"
title = "Handler takes its context FIRST, so it cannot receive a bound method"
category = "Warnings"
severity = "warning"
repro = "checked"
lang = "cplus"
verified = true
emit_site = "cplus-core/src/sema.rs:check_handler_ctx_slots"
test = "cpc/tests/e2e.rs:ctx_first_handler_warns_w0825"
cause = "The mirror of W0824. A defaulted `*u8` sits right after the handler, so a wired handler is plainly what was meant — but the fn-pointer takes its `*u8` FIRST. A bound reference fills the slot after the handler with the receiver's address and the bridge reads it from the fn's LAST parameter, so a ctx-first handler can never receive a method however correct the slot beside it looks. W0824 does not see this shape, because it looks for a TRAILING `*u8`. Quiet on `fn(*u8, *u8)` (the ordinary sender-plus-ctx handler), on a bare `fn(*u8)` (the release-hook shape), and on a ctx-first fn with no context slot beside it (not a wired handler at all)."
fix = "Move the `*u8` to the end of the handler's parameter list: `fn(usize, *u8)` rather than `fn(*u8, usize)`. The context parameter beside it is already right; it is the fn type that is reversed."
example = '''
struct Row { n: i32 }
impl Row { fn build(ref this, at: usize) -> i32 { return 1; } }

// -> W0825: `f` takes its context first
fn set_row(f: fn(*u8, usize) -> i32, ctx: *u8 = 0 as *u8) -> i32 { return 1; }

// the shape that accepts `set_row(row.build)`
fn good(f: fn(usize, *u8) -> i32, ctx: *u8 = 0 as *u8) -> i32 { return 2; }
'''

