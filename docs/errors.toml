    fn set(ref this, k: str) {
        this.view = k;
        return;
    }
}
'''

[[code]]
id = "E0516"
title = "Storing a view through a raw pointer without a declared flow"
category = "Ownership and borrowing"
severity = "error"
repro = "checked"
lang = "cplus"
verified = true
emit_site = "cplus-core/src/borrowck.rs (ViewRules::check_raw_store)"
test = "cpc/tests/e2e.rs:raw_view_store_requires_keeps_e0516"
cause = "A `str` / `T[]` / view-carrying value is stored through a raw-pointer deref — `*slot = v`, and equally any projection of the pointee (`(*sink).key = v`, `(*sink)[i] = v`). No flow analysis can see what the pointer points at, so a field of the pointee is exactly as opaque as the whole pointee, and the function's effect on view lifetimes is unknowable — silence at the raw seam is not neutral, the same doctrine as the raw-pointer field rule (drop-or-`opaque`, E0510)."
fix = "Declare the function's flow: `#[keeps(this)]` if the view survives inside the receiver (callers then tie the receiver to the argument's owner), or `#[keeps(nothing)]` if the bytes are copied and no borrowed view escapes. Better still, remove the seam: store an owned `Text` so the struct outlives its own bytes. Byte and pointer stores never trigger this — only a view value does, and a store to a field of a plain local is not a raw store at all."
example = '''
fn stash(slot: *str, v: str) {
    *slot = v;
    return;
}
'''

