test = "cplus-core/src/borrowck.rs:e3_fires_e0372_on_move_of_other_source"
cause = "A binding is moved while a live borrower still holds a borrow of it (or one of its sub-places) at an overlapping place."
fix = "Drop the borrower before moving the value, or clone it if both bindings must outlive the move."
note = "In this minimal form `cpc` reports E0335; E0372 is the borrow checker's classification of moving a value while it is borrowed."
example = '''
struct B { x: i32 }
impl B { fn drop(ref this) { return; } }
fn longest(a: B, b: B) -> B {
  if a.x > b.x { return a; }
  return b;
}
fn drain(take b: B) { return; }
fn caller() {
  let a: B = B { x: 1 };
  let b: B = B { x: 2 };
  let r: B = longest(a, b);
  drain(a);
  return;
}
'''

