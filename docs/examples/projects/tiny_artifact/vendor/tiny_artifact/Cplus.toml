[package]
name    = "tiny_artifact"
version = "0.0.1"
edition = "2026"

# Phase 2 Slice 2D smoke test: bundled-artifact package mode.
#
# `[link].bundled` names the static archive shipped under
# `lib/<target-triple>/`. The selected build target derives the directory
# name; there is no declared triples list. A missing target directory falls
# back to source. If the directory exists, every declared archive must exist
# inside it (E0860).

[link]
bundled = ["libtiny_artifact.a"]
