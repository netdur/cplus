[package]
name    = "metal_compute"
version = "0.0.1"
edition = "2026"

# v0.0.7 Phase 4.1: dropped the `--emit-ll | clang` two-step in favor of
# plain `cpc build`. The app's `[link]` table is its link surface: cpc
# expands `frameworks` + `libs` into `-framework <name>` / `-l<name>`.
[link]
frameworks = ["Metal", "Foundation"]
libs       = ["objc"]
